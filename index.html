<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ironvow</title>
  <meta name="description" content="A fantasy RPG where your real daily habits are the quests.">
  <meta name="theme-color" content="#0D0B1A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ironvow">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=Press+Start+2P&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app" id="app"><p class="loading">Loading your hero…</p></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="levelup" id="levelup" aria-live="polite"></div>

  <!-- No build step. boot-guard shows a message if the game fails to start; pixel-items is the sprite
       generator (window.PixelItems); main.js is an ES module that imports everything else. See CLAUDE.md. -->
  <script src="js/boot-guard.js"></script>
  <script src="js/lib/pixel-items.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
